services:
  smart-topology:
    build: .
    container_name: smart-topology-noc
    restart: unless-stopped
    # network_mode: host ช่วยให้ ping อุปกรณ์ใน LAN ได้ตรงที่สุด (Linux)
    network_mode: host
    environment:
      - PORT=3000
      - ADMIN_PASSWORD=ChangeMe@2026   # รหัสผ่าน admin ครั้งแรก (เปลี่ยนได้)
      # - COOKIE_SECURE=1              # เปิดเมื่อใช้งานผ่าน HTTPS
    volumes:
      - ./data:/data
